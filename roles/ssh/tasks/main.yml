---
# ── SSH インストール・セキュリティ設定 ───────────

- name: openssh-server をインストール
  become: true
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: false
  tags: ssh

# ── sshd_config を安全な設定に変更 ───────────────

- name: SSH ポートを 2232 に変更
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Port\s'
    line: 'Port 2232'
    state: present
    backup: true   # 変更前にバックアップ (.bak) を作成
  notify: restart sshd
  tags: ssh

- name: 公開鍵認証を有効化
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PubkeyAuthentication\s'
    line: 'PubkeyAuthentication yes'
    state: present
  notify: restart sshd
  tags: ssh

- name: パスワード認証を無効化
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication\s'
    line: 'PasswordAuthentication no'
    state: present
  notify: restart sshd
  tags: ssh

- name: チャレンジレスポンス認証を無効化
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?ChallengeResponseAuthentication\s'
    line: 'ChallengeResponseAuthentication no'
    state: present
  notify: restart sshd
  tags: ssh

- name: root ログインを無効化
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin\s'
    line: 'PermitRootLogin no'
    state: present
  notify: restart sshd
  tags: ssh

- name: 空パスワードを禁止
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitEmptyPasswords\s'
    line: 'PermitEmptyPasswords no'
    state: present
  notify: restart sshd
  tags: ssh

# ── sshd_config の構文チェック ────────────────────
- name: sshd_config の構文チェック
  become: true
  ansible.builtin.command: sshd -t
  changed_when: false
  check_mode: false   # チェックモードでも構文確認は実行
  tags: ssh

# ── サービス管理 ──────────────────────────────────

- name: SSH サービスを有効化・起動
  become: true
  ansible.builtin.systemd:
    name: ssh
    enabled: true
    state: started
  tags: ssh

# ── 現在の設定を確認 ──────────────────────────────

- name: SSH 設定を確認
  ansible.builtin.shell: |
    grep -E '^(Port|PubkeyAuthentication|PasswordAuthentication|PermitRootLogin)' /etc/ssh/sshd_config
  register: ssh_config_check
  changed_when: false
  check_mode: false
  tags: ssh

- name: SSH 設定内容を表示
  ansible.builtin.debug:
    msg: "{{ ssh_config_check.stdout_lines }}"
  tags: ssh
