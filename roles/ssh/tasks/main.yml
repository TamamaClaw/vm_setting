---
# ── SSH インストール・セキュリティ設定 ───────────

- name: openssh-server をインストール
  become: true
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: false
  tags: ssh

# ── 公開鍵登録 ────────────────────────────────────

- name: .ssh ディレクトリを作成
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"
  tags: ssh

- name: 公開鍵を authorized_keys に追加
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ ssh_authorized_keys }}"
  when: ssh_authorized_keys | length > 0
  tags: ssh

# ── sshd_config.d ドロップイン設定 ────────────────

- name: sshd_config.d ディレクトリ確認
  become: true
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: "0755"
  tags: ssh

- name: セキュア SSH 設定を配置
  become: true
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardened.conf
    mode: "0644"
    content: |
      Port {{ ssh_port }}
      PubkeyAuthentication {{ ssh_pubkey_authentication }}
      PasswordAuthentication {{ ssh_password_authentication }}
      ChallengeResponseAuthentication no
      PermitRootLogin {{ ssh_permit_root_login }}
      PermitEmptyPasswords no
  notify: restart sshd
  tags: ssh

# ── sshd_config の Include 確認 ───────────────────

- name: sshd_config に Include ディレクティブがあるか確認
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    state: present
    insertbefore: BOF
  notify: restart sshd
  tags: ssh

# ── 構文チェック ──────────────────────────────────

- name: sshd_config の構文チェック
  become: true
  ansible.builtin.command: sshd -t
  changed_when: false
  check_mode: false
  tags: ssh

# ── サービス管理 ──────────────────────────────────

- name: SSH サービスを有効化・起動
  become: true
  ansible.builtin.systemd:
    name: ssh
    enabled: true
    state: started
  tags: ssh

# ── 確認表示 ──────────────────────────────────────

- name: SSH 設定を表示
  ansible.builtin.debug:
    msg: "✅ SSH: port={{ ssh_port }}, pubkey={{ ssh_pubkey_authentication }}, password={{ ssh_password_authentication }}"
  tags: ssh
