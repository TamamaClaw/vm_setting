---
# Dataiku DSS セットアップ専用プレイブック
#
# 実行:
#   ansible-playbook -i inventory.ini dataiku.yml
#   ansible-playbook -i inventory.ini dataiku.yml --check   # チェックモード
#
# 変数オーバーライド例:
#   ansible-playbook -i inventory.ini dataiku.yml \
#     -e dataiku_port=10001 \
#     -e dataiku_install_dir=/opt/dataiku

- name: Dataiku DSS セットアップ
  hosts: all
  gather_facts: true
  become: false

  roles:
    - role: dataiku
      tags: dataiku
